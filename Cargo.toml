[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["The Frevo authors"]
repository = "https://github.com/gointerop/frevo"
homepage = "https://github.com/gointerop/frevo"
description = "Frevo - a high-performance HL7 FHIR server in Rust"
keywords = ["healthcare", "interoperability", "server"]
categories = ["web-programming::http-server"]

[workspace.dependencies]
# Internal crates
frevo-codegen = { path = "crates/frevo-codegen", version = "0.0.0" }
frevo-model = { path = "crates/frevo-model", version = "0.0.0" }
frevo-path = { path = "crates/frevo-path", version = "0.0.0" }
frevo-convert = { path = "crates/frevo-convert", version = "0.0.0" }
frevo-package = { path = "crates/frevo-package", version = "0.0.0" }
frevo-validator = { path = "crates/frevo-validator", version = "0.0.0" }
frevo-terminology = { path = "crates/frevo-terminology", version = "0.0.0" }
frevo-store = { path = "crates/frevo-store", version = "0.0.0" }
frevo-search = { path = "crates/frevo-search", version = "0.0.0" }
frevo-jobs = { path = "crates/frevo-jobs", version = "0.0.0" }
frevo-subscription = { path = "crates/frevo-subscription", version = "0.0.0" }
frevo-mdm = { path = "crates/frevo-mdm", version = "0.0.0" }
frevo-cql = { path = "crates/frevo-cql", version = "0.0.0" }
frevo-cr = { path = "crates/frevo-cr", version = "0.0.0" }
frevo-ips = { path = "crates/frevo-ips", version = "0.0.0" }
frevo-graphql = { path = "crates/frevo-graphql", version = "0.0.0" }
frevo-hfql = { path = "crates/frevo-hfql", version = "0.0.0" }
frevo-narrative = { path = "crates/frevo-narrative", version = "0.0.0" }
frevo-openapi = { path = "crates/frevo-openapi", version = "0.0.0" }
frevo-mcp = { path = "crates/frevo-mcp", version = "0.0.0" }
frevo-config = { path = "crates/frevo-config", version = "0.0.0" }

# External: HTTP / async core
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
hyper = { version = "1", default-features = false }
tower = { version = "0.5", default-features = false }
tower-http = { version = "0.6", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
serde_yaml_ng = { version = "0.10" }

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

# Profile for shipped artifacts (container image, release binaries).
[profile.dist]
inherits = "release"
lto = "fat"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = 1
