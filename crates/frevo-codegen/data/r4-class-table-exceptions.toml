#                                           class, by name and through `*`
#   runtime-class  by_name = "<FHIR type>"  navigating by name yields that type's
#                                           class; `*` keeps the declared one
#   class-name     class_name = "<name>"    the nested component's class name
#
# The generator refuses an entry with no source, a target that is not in the
# package, or no effect.

